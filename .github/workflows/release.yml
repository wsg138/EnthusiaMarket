name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LUMAGUILDS_JAR: ${{ github.workspace }}/libs/LumaGuilds.jar

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Bump version
        id: bump
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            BASE=$(grep -oP 'version\s*=\s*findProperty.*\?\s*:\s*"\K[^"]+' build.gradle.kts)
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
          else
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
          fi
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest tag: ${LATEST:-none}, bumping to v$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Fetch tested, checksum-pinned LumaGuilds dependency
        env:
          LUMAGUILDS_VERSION: "2.1.24"
          LUMAGUILDS_SHA256: "54ad645587f2ce895738eff3ee05123eb19e5687d80fa6d657aa3092031004c2"
        run: |
          set -Eeuo pipefail
          mkdir -p libs
          # Match build.yml: do not silently compile against an incompatible
          # new upstream release (the latest JAR carries Kotlin 2.3 metadata).
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output libs/LumaGuilds.jar \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v${LUMAGUILDS_VERSION}/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          echo "${LUMAGUILDS_SHA256}  libs/LumaGuilds.jar" | sha256sum --check --strict

      - name: Build shadowJar
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: ./gradlew shadowJar --no-daemon -PreleaseVersion="$RELEASE_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: EnthusiaMarket v${{ steps.bump.outputs.version }}
          files: build/libs/EnthusiaMarket-${{ steps.bump.outputs.version }}.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
