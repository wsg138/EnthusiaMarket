name: Muse Market build diagnostic

on:
  push:
    branches:
      - fix/muse-staff-integration-defects

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Reproduce LumaGuilds dependency bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROSECHAT_PREHOOK_REF: 3fe078a
      PLAYTIME_API_REF: 2a5b57d
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.10.2'

      - name: Build RoseChat bootstrap
        run: |
          set -euo pipefail
          git clone -q https://github.com/BadgersMC/Enthusia-RoseChat.git "$RUNNER_TEMP/rosechat-prehook"
          cd "$RUNNER_TEMP/rosechat-prehook"
          git checkout -q "$ROSECHAT_PREHOOK_REF"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon >/tmp/rosechat-prehook.log 2>&1
          ROSE_JAR=$(ls build/libs/RoseChat-RC-2*.jar | grep -v '\-sources\|-javadoc' | head -1)
          mkdir -p "$RUNNER_TEMP/lumaguilds-deps"
          cp "$ROSE_JAR" "$RUNNER_TEMP/lumaguilds-deps/RoseChat-RC-2.jar"

      - name: Build EnthusiaPlaytime API dependency
        run: |
          set -euo pipefail
          git clone -q https://github.com/wsg138/PlayTimePlugin.git "$RUNNER_TEMP/playtime"
          cd "$RUNNER_TEMP/playtime"
          git checkout -q "$PLAYTIME_API_REF"
          mkdir -p "$RUNNER_TEMP/playtime-classes" "$RUNNER_TEMP/lumaguilds-deps"
          javac -d "$RUNNER_TEMP/playtime-classes" \
            src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
            src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
            src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
            src/main/java/org/enthusia/playtime/activity/ActivityState.java \
            src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
            src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
          jar cf "$RUNNER_TEMP/lumaguilds-deps/EnthusiaPlaytime-api.jar" \
            -C "$RUNNER_TEMP/playtime-classes" .

      - name: Build CombatLogX API dependency
        run: |
          set -euo pipefail
          git clone -q https://github.com/SirBlobman/CombatLogX.git "$RUNNER_TEMP/combatlogx"
          cd "$RUNNER_TEMP/combatlogx"
          git checkout -q "$COMBATLOGX_API_REF"
          chmod +x gradlew
          ./gradlew :api:jar --no-daemon >/tmp/combatlogx.log 2>&1
          COMBATLOGX_JAR=$(find api/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          test -n "$COMBATLOGX_JAR"
          cp "$COMBATLOGX_JAR" "$RUNNER_TEMP/lumaguilds-deps/CombatLogX-api.jar"

      - name: Capture LumaGuilds build
        id: lg
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/muse-market-diagnostic
          git clone -q --depth 1 https://github.com/BadgersMC/LumaGuilds.git "$RUNNER_TEMP/lumaguilds"
          mkdir -p "$RUNNER_TEMP/lumaguilds/libs"
          cp "$RUNNER_TEMP/lumaguilds-deps/RoseChat-RC-2.jar" "$RUNNER_TEMP/lumaguilds/libs/RoseChat-RC-2.jar"
          cp "$RUNNER_TEMP/lumaguilds-deps/EnthusiaPlaytime-api.jar" "$RUNNER_TEMP/lumaguilds/libs/EnthusiaPlaytime-api.jar"
          cp "$RUNNER_TEMP/lumaguilds-deps/CombatLogX-api.jar" "$RUNNER_TEMP/lumaguilds/libs/CombatLogX-api.jar"
          cd "$RUNNER_TEMP/lumaguilds"
          chmod +x gradlew
          set +e
          ./gradlew shadowJar --no-daemon --stacktrace --console=plain 2>&1 \
            | tee /tmp/muse-market-diagnostic/lumaguilds-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/muse-market-diagnostic/lumaguilds-build.status
          if (( status != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JAR=$(ls build/libs/LumaGuilds-*.jar | grep -v '\-sources\|-javadoc' | head -1)
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Capture Market build
        if: steps.lg.outputs.failed == 'false'
        env:
          LUMAGUILDS_JAR: ${{ steps.lg.outputs.jar }}
        shell: bash
        run: |
          set +e
          ./gradlew test shadowJar jacocoTestReport --no-daemon --stacktrace --console=plain 2>&1 \
            | tee /tmp/muse-market-diagnostic/market-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/muse-market-diagnostic/market-build.status
          exit 0

      - name: Collect reports
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/muse-market-diagnostic
          cp /tmp/rosechat-prehook.log /tmp/combatlogx.log /tmp/muse-market-diagnostic/ 2>/dev/null || true
          if [ -d build/reports/tests/test ]; then cp -R build/reports/tests/test /tmp/muse-market-diagnostic/test-report; fi
          if [ -d build/test-results/test ]; then cp -R build/test-results/test /tmp/muse-market-diagnostic/test-results; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muse-market-build-diagnostic
          path: /tmp/muse-market-diagnostic
          retention-days: 1
          if-no-files-found: error
