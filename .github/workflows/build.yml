name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      # Nexus is now resolved from JitPack — no clone/publish step needed.
      # See build.gradle.kts for the com.github.BadgersMC.Nexus coordinates.

      # LumaGuilds and RoseChat have a circular source-level compile dependency.
      # LumaGuilds publishes release jars from its own CI, so consume one pinned
      # release artifact here instead of rebuilding LumaGuilds through unrelated
      # third-party Maven repositories. The digest binds the exact jar bytes.
      # RoseChat master is still compiled against that jar below, so its current
      # LumaGuilds channel hook remains validated before Market itself is tested.
      - name: Fetch pinned LumaGuilds release
        id: lg
        env:
          LUMAGUILDS_VERSION: "2.1.24"
          LUMAGUILDS_SHA256: "54ad645587f2ce895738eff3ee05123eb19e5687d80fa6d657aa3092031004c2"
        run: |
          JAR="$RUNNER_TEMP/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$JAR" \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v${LUMAGUILDS_VERSION}/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          echo "${LUMAGUILDS_SHA256}  ${JAR}" | sha256sum --check --strict
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/lumaguilds-out"
          cp "$JAR" "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar"

      - name: Build RoseChat (master, with hook)
        run: |
          git clone --depth 1 --branch master https://github.com/BadgersMC/Enthusia-RoseChat.git "$RUNNER_TEMP/rosechat-master"
          mkdir -p "$RUNNER_TEMP/rosechat-master/libs"
          cp "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar" "$RUNNER_TEMP/rosechat-master/libs/LumaGuilds-2.1.0.jar"
          cd "$RUNNER_TEMP/rosechat-master"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Test and shadowJar
        env:
          LUMAGUILDS_JAR: ${{ steps.lg.outputs.jar }}
        run: ./gradlew test shadowJar jacocoTestReport --no-daemon

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/test/jacocoTestReport.xml
        continue-on-error: true

  detekt:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.10.2"
      - name: Run detekt
        run: ./gradlew detekt --no-daemon
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >
            p/kotlin
            p/java
            p/secrets
            p/sql-injection
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
