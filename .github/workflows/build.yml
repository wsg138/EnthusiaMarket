name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROSECHAT_PREHOOK_REF: 3fe078a
      PLAYTIME_API_REF: 2a5b57d
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      # Nexus is now resolved from JitPack — no clone/publish step needed.
      # See build.gradle.kts for the com.github.BadgersMC.Nexus coordinates.

      # ---------------------------------------------------------------------
      # RoseChat <-> LumaGuilds is a circular compile dependency:
      #   - RoseChat master has the LumaGuilds channel hook  (needs LumaGuilds jar)
      #   - LumaGuilds needs the RoseChat jar to compile its chat listeners
      # LumaGuilds also expects local PlayTime and CombatLogX API jars. These refs
      # intentionally mirror LumaGuilds' own CI so Market cannot silently validate
      # against a different dependency graph.
      # ---------------------------------------------------------------------
      - name: Build RoseChat (pre-hook) for LumaGuilds bootstrap
        run: |
          set -euo pipefail
          git clone https://github.com/BadgersMC/Enthusia-RoseChat.git "$RUNNER_TEMP/rosechat-prehook"
          cd "$RUNNER_TEMP/rosechat-prehook"
          git checkout "$ROSECHAT_PREHOOK_REF"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon
          ROSE_JAR=$(ls "$RUNNER_TEMP/rosechat-prehook/build/libs/"RoseChat-RC-2*.jar | grep -v '\-sources\|-javadoc' | head -1)
          mkdir -p "$RUNNER_TEMP/lumaguilds-deps"
          cp "$ROSE_JAR" "$RUNNER_TEMP/lumaguilds-deps/RoseChat-RC-2.jar"

      - name: Build EnthusiaPlaytime API for LumaGuilds bootstrap
        run: |
          set -euo pipefail
          git clone https://github.com/wsg138/PlayTimePlugin.git "$RUNNER_TEMP/playtime"
          cd "$RUNNER_TEMP/playtime"
          git checkout "$PLAYTIME_API_REF"
          mkdir -p "$RUNNER_TEMP/playtime-classes" "$RUNNER_TEMP/lumaguilds-deps"
          javac -d "$RUNNER_TEMP/playtime-classes" \
            src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
            src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
            src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
            src/main/java/org/enthusia/playtime/activity/ActivityState.java \
            src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
            src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
          jar cf "$RUNNER_TEMP/lumaguilds-deps/EnthusiaPlaytime-api.jar" \
            -C "$RUNNER_TEMP/playtime-classes" .

      - name: Build CombatLogX API for LumaGuilds bootstrap
        run: |
          set -euo pipefail
          git clone https://github.com/SirBlobman/CombatLogX.git "$RUNNER_TEMP/combatlogx"
          cd "$RUNNER_TEMP/combatlogx"
          git checkout "$COMBATLOGX_API_REF"
          chmod +x gradlew
          ./gradlew :api:jar --no-daemon
          COMBATLOGX_JAR=$(find api/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          test -n "$COMBATLOGX_JAR"
          cp "$COMBATLOGX_JAR" "$RUNNER_TEMP/lumaguilds-deps/CombatLogX-api.jar"

      - name: Build LumaGuilds shadowJar
        id: lg
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/BadgersMC/LumaGuilds.git "$RUNNER_TEMP/lumaguilds"
          mkdir -p "$RUNNER_TEMP/lumaguilds/libs"
          cp "$RUNNER_TEMP/lumaguilds-deps/RoseChat-RC-2.jar" "$RUNNER_TEMP/lumaguilds/libs/RoseChat-RC-2.jar"
          cp "$RUNNER_TEMP/lumaguilds-deps/EnthusiaPlaytime-api.jar" "$RUNNER_TEMP/lumaguilds/libs/EnthusiaPlaytime-api.jar"
          cp "$RUNNER_TEMP/lumaguilds-deps/CombatLogX-api.jar" "$RUNNER_TEMP/lumaguilds/libs/CombatLogX-api.jar"
          cd "$RUNNER_TEMP/lumaguilds"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon
          JAR=$(ls "$RUNNER_TEMP/lumaguilds/build/libs/"LumaGuilds-*.jar | grep -v '\-sources\|-javadoc' | head -1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          # Stage under the exact name RoseChat's build.gradle expects in libs/
          mkdir -p "$RUNNER_TEMP/lumaguilds-out"
          cp "$JAR" "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar"

      - name: Build RoseChat (master, with hook) — validates the cycle closes
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/BadgersMC/Enthusia-RoseChat.git "$RUNNER_TEMP/rosechat-master"
          mkdir -p "$RUNNER_TEMP/rosechat-master/libs"
          cp "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar" "$RUNNER_TEMP/rosechat-master/libs/LumaGuilds-2.1.0.jar"
          cd "$RUNNER_TEMP/rosechat-master"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Test and shadowJar
        env:
          LUMAGUILDS_JAR: ${{ steps.lg.outputs.jar }}
        run: ./gradlew test shadowJar jacocoTestReport --no-daemon

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/test/jacocoTestReport.xml
        continue-on-error: true

  detekt:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.10.2"
      - name: Run detekt
        run: ./gradlew detekt --no-daemon
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >
            p/kotlin
            p/java
            p/secrets
            p/sql-injection
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
